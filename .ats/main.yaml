# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates the
# kind cluster and hands ATS its kubeconfig; helm and kubectl come with the
# ATS image.
#
# Smoke: ATS installs the packaged umbrella with `helm upgrade --install
# --wait` into the `kagent` namespace (values.yaml pins the core resources to
# that namespace via namespaceOverride and nothing else creates it on a bare
# cluster, so the release has to land there for `--create-namespace` to make
# it), with tests/ats/values.yaml, which gives the release the shape the
# agent-platform meta-package deploys: bundled declarative agents and kagent's
# own MCP servers off, a placeholder provider key so the ModelConfig is
# accepted. Without that, Helm 4's `--wait` sits on the never-Ready Agent CRs
# until the 30 min timeout. The kagent images come from the gsoci mirrors.
# tests/ats asserts that the kagent-controller Deployment is ready, that a
# minimal declarative Agent (default ModelConfig, fake provider key) reaches
# Ready on the flat gsoci Go ADK runtime image, and that the RemoteMCPServer
# for the bundled kagent-tools points at a Service that exists and becomes
# Accepted (the controller reaches the tool server), and that the bundled
# oauth2-proxy (on, placeholder client, OIDC discovery skipped) runs the gsoci
# mirror image and is available.
#
# functional and upgrade stay skipped: there is no second scenario yet.
app-tests-deploy-namespace: kagent
app-tests-app-config-file: tests/ats/values.yaml
skip-steps: [functional,upgrade]
