# Values for the vendored upstream kagent controller chart. The upstream chart is
# a subchart under charts/kagent (managed by vendir, pinned in vendir.lock.yml).
# Subchart values are namespaced under its chart name (`kagent`).
#
# Only Giant-Swarm-wide sensible defaults live here (registry, retagged image
# repositories, pinned tag, naming). Cluster/topology-specific wiring (controller
# auth mode, metrics env, security contexts, oauth2-proxy, model providers) stays
# in the agent-platform meta-package, which overrides these via valuesFrom.
#
# Every object under `kagent` is marked additionalProperties: true: the upstream
# subchart's full (large) values structure is merged in and flows through this
# wrapper, so the generated values.schema.json must accept arbitrary upstream keys
# while still documenting the GS defaults below.
#
# Note on the version/tag label: wrapping the upstream chart as a subchart means
# its `.Chart.Version` stays the clean version vendir pinned even when
# helm-controller sources THIS umbrella chart via OCIRepository (the OCI +digest
# is appended to the umbrella version, not the subchart). The upstream image tag
# coalesces to that `.Chart.Version`, so no explicit `kagent.tag` pin is needed
# here -- nor the postRenderer label-sanitization hack the meta-package used when
# it pulled the upstream chart directly.
kagent:  # @schema additionalProperties: true
  # Pin the release-independent name so the controller Service is always
  # `kagent-controller` regardless of the umbrella release name.
  fullnameOverride: kagent
  # Pull kagent images from the GS-retagged registry (retagger uses
  # override_repo_name, so the repository paths are flat, not the upstream
  # kagent-dev/kagent/* hierarchy).
  registry: gsoci.azurecr.io/giantswarm
  controller:  # @schema additionalProperties: true
    image:  # @schema additionalProperties: true
      repository: kagent-controller
    agentImage:  # @schema additionalProperties: true
      repository: kagent-app
    skillsInitImage:  # @schema additionalProperties: true
      repository: kagent-skills-init
    # The Go ADK runtime image for declarative agents with `runtime: go` -- the
    # CRD default since upstream 0.10.0, which also introduced this key (before
    # it, the controller derived the Go image from agentImage.repository). The
    # upstream default repository is the nested `kagent-dev/kagent/golang-adk`;
    # retagger mirrors it flat as `golang-adk` (giantswarm/retagger
    # images/renamed-kagent.yaml), so without this mapping every new declarative
    # agent pod fails to pull and the Agent never reports Ready.
    goAgentImage:  # @schema additionalProperties: true
      repository: golang-adk
  ui:  # @schema additionalProperties: true
    image:  # @schema additionalProperties: true
      repository: kagent-ui
  # Keep kagent core resources in a dedicated namespace separate from the
  # umbrella release namespace.
  namespaceOverride: kagent
  # The bundled kagent-tools subchart reads its own image/resources keys
  # (`.Values.tools.*`) and does NOT inherit the parent `kagent.registry`.
  kagent-tools:  # @schema additionalProperties: true
    # Keep equal to `kagent.namespaceOverride`. The subchart renders its
    # Deployment, Services and ServiceAccount into its OWN `namespaceOverride`
    # (default: the release namespace), while the parent chart's RemoteMCPServer
    # `kagent-tool-server` composes the tool-server URL from the PARENT's
    # namespace (charts/kagent/templates/toolserver-kagent.yaml renders
    # `http://<tools fullname>.<kagent namespace>:8084/mcp`). Nothing upstream
    # ties the two together, so with a release namespace other than `kagent`
    # (the agent-platform layout) the Service landed in the release namespace,
    # the URL pointed at `kagent-tools.kagent`, and the RemoteMCPServer stayed
    # Accepted=False ("no such host"): agents referencing the built-in tools
    # had none. `make verify` renders that layout and fails when the two
    # namespaces disagree.
    namespaceOverride: kagent
    tools:  # @schema additionalProperties: true
      image:  # @schema additionalProperties: true
        # Source the tool-server image from the GS-retagged registry (mirror of
        # ghcr.io/kagent-dev/kagent/tools) so it satisfies the
        # restrict-image-registries Kyverno policy. `tag` is intentionally unset:
        # the subchart coalesces it to its Chart.Version, keeping the image tag
        # in lockstep with the vendored kagent-tools version.
        registry: gsoci.azurecr.io
        repository: giantswarm/kagent-tools
      # ephemeral-storage requests+limits are required because the cluster
      # injects a writable /tmp emptyDir (readOnlyRootFilesystem) without a
      # sizeLimit, which trips require-emptydir-requests-and-limits unless the
      # mounting container declares ephemeral-storage.
      resources:  # @schema additionalProperties: true
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 50Mi
        limits:
          cpu: "1"
          memory: 512Mi
          ephemeral-storage: 512Mi
