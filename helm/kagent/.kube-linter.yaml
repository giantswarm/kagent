---
# kube-linter configuration for the kagent chart.
#
# The controller, UI and bundled agent subcharts are the vendored upstream
# kagent-dev/kagent chart. On Giant Swarm clusters the restricted-PSS
# securityContext is applied via the agent-platform meta-package values (and a
# Kyverno mutate policy), not baked into this chart's defaults, so the static
# PSS checks are handled at the platform layer. Exclude them here.
checks:
  exclude:
    - "no-read-only-root-fs"
    - "run-as-non-root"
    - "unset-cpu-requirements"
    - "unset-memory-requirements"
    # The vendored upstream subcharts (e.g. grafana-mcp) reference :latest images
    # we don't control; actual subchart enablement/images are driven by the
    # agent-platform meta-package, not this chart's lint-time defaults.
    - "latest-tag"
