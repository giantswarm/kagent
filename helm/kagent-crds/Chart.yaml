# See https://docs.giantswarm.io/reference/platform-api/chart-metadata/
# for details and background.
#
# Optional Helm-managed CRD lifecycle for the kagent.dev CRDs (and the kmcp
# MCPServer CRD the kagent controller registers), published from the same
# vendored manifests as helm/kagent/crds/. Install this chart INSTEAD of relying
# on that dir; installing both makes two Helm releases own the same
# cluster-scoped objects.

apiVersion: v2
# Kept in step with the vendored kagent-crds chart by sync/patches/chart-yaml.
appVersion: 0.10.0
name: kagent-crds
description: Giant Swarm packaging of the upstream kagent.dev CRDs (Agent, AgentHarness, Memory, ModelConfig, ModelProviderConfig, RemoteMCPServer, SandboxAgent, ToolServer) and the kmcp MCPServer CRD as a Helm-managed chart.
home: https://github.com/giantswarm/kagent
icon: https://s.giantswarm.io/app-icons/giantswarm/1/light.svg
sources:
  - https://github.com/giantswarm/kagent
  - https://github.com/kagent-dev/kagent
version: 0.0.0-dev
annotations:
  io.giantswarm.application.audience: all
  io.giantswarm.application.managed: "true"
  io.giantswarm.application.team: bumblebee
