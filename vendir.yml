apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.12.0
directories:
# Stage 1: pristine upstream artifacts. Nothing here is published; the flatten
# below copies from it, and sync/sync.sh diffs it against the chart to produce
# diffs/, so a reviewer of a version bump sees the whole delta from upstream.
- path: vendor
  contents:
  # Upstream kagent controller chart (published OCI chart, not the git tree: the
  # git tree ships Chart-template.yaml and file:// subchart paths that only
  # resolve at upstream release time). The packaged chart already carries every
  # bundled subchart (kmcp, substrate, kagent-tools, the agents, oauth2-proxy)
  # under charts/. It ships NO CRDs of its own.
  - path: kagent
    helmChart:
      name: kagent
      version: "0.10.0"
      repository:
        url: oci://ghcr.io/kagent-dev/kagent/helm
  # Upstream kagent-crds chart. Its templates/ holds the pristine kagent.dev CRD
  # manifests; charts/kmcp-crds/ holds the kmcp MCPServer CRD at the kmcp
  # version this kagent release depends on. Both charts are cut from the same
  # upstream tag, so the two pins above and here must be equal (sync/verify.sh).
  - path: kagent-crds
    helmChart:
      name: kagent-crds
      version: "0.10.0"
      repository:
        url: oci://ghcr.io/kagent-dev/kagent/helm

# Stage 2: flatten the upstream controller chart onto the chart root, so
# consumers set upstream keys at the top level (controller.*) with no wrapper
# nesting. ignorePaths lists the files this repo owns; vendir leaves those
# alone instead of deleting them as unmanaged content. sync/sync.sh then
# re-applies the Giant Swarm delta (see sync/patches/).
- path: helm/kagent
  contents:
  - path: .
    directory:
      path: vendor/kagent
    # Upstream's own dependency lock and the release-time template are not part
    # of this chart: Chart.yaml is repo-owned and sync/patches/chart-yaml writes
    # the dependency list from the vendored one. Upstream's chart unit tests
    # (helm-unittest) sit outside templates/ and are not run here.
    excludePaths:
    - Chart.lock
    - Chart-template.yaml
    - tests/**/*
    ignorePaths:
    # Chart metadata is ours: our own version line, our team annotation, and no
    # dependency on upstream. sync/patches/chart-yaml keeps appVersion and the
    # bundled-subchart dependency list in step with the vendored chart.
    - Chart.yaml
    # App-owned CRDs, written by sync/patches/crds from vendor/kagent-crds.
    - crds/*/*.yaml
    # Repo-owned docs and generated schema. values.schema.json is regenerated by
    # the helm-schema pre-commit hook from values.yaml + .schema.yaml.
    - README.md
    - README.md.gotmpl
    - .kube-linter.yaml
    - .schema.yaml
    - values.schema.json
    - zz_generated.app-platform.values.yaml

# Stage 2b: the CRD chart, published from this repo as the optional
# Helm-managed CRD lifecycle path (templated CRDs, `keep` injected by
# sync/patches/crds). Consumers that let Helm own the CRDs install this chart
# and disable the crds/ dir of the main chart. The kmcp MCPServer CRD is copied
# into templates/ by sync/patches/crds; the substrate CRDs are not shipped
# (substrate.enabled is false upstream and in every consumer).
- path: helm/kagent-crds
  contents:
  - path: .
    directory:
      path: vendor/kagent-crds
    excludePaths:
    - Chart.lock
    - Chart-template.yaml
    - charts/**/*
    - templates/NOTES.txt
    ignorePaths:
    # Chart metadata is ours; README.md is generated by helm-docs.
    - Chart.yaml
    - README.md
    - README.md.gotmpl
    - templates/_helpers.tpl
    - templates/mcpserver-crd.yaml
    # Repo-owned values and generated schema. app-build-suite's Giant Swarm
    # validator (F0001) requires a values schema; the pre-commit schema hook
    # generates it from values.yaml + .schema.yaml, with the app-platform values
    # merged in so an App-deployed chart accepts the injected cluster values.
    - values.yaml
    - .schema.yaml
    - values.schema.json
    - zz_generated.app-platform.values.yaml
