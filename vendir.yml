apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.12.0
directories:
# Stage 1: pristine upstream artifacts. Nothing here is published; the flatten
# below copies from it, and sync/sync.sh diffs it against the chart to produce
# diffs/, so a reviewer of a version bump sees the whole delta from upstream.
- path: vendor
  contents:
  # Upstream kagent controller chart. The published OCI chart, not the git tree:
  # only the release resolves the file:// subchart paths and bundles the
  # subcharts under charts/. It ships no CRDs.
  - path: kagent
    helmChart:
      name: kagent
      version: "0.10.0"
      repository:
        url: oci://ghcr.io/kagent-dev/kagent/helm
  # Upstream kagent-crds chart: the kagent.dev CRDs plus the kmcp MCPServer CRD
  # under charts/kmcp-crds/. Same tag as the chart above (sync/verify.sh).
  - path: kagent-crds
    helmChart:
      name: kagent-crds
      version: "0.10.0"
      repository:
        url: oci://ghcr.io/kagent-dev/kagent/helm

# Stage 2: flatten the upstream controller chart onto the chart root, so
# consumers set upstream keys at the top level (controller.*) with no wrapper
# nesting. ignorePaths lists the files this repo owns; vendir leaves those
# alone instead of deleting them as unmanaged content. sync/sync.sh then
# re-applies the Giant Swarm delta (see sync/patches/).
- path: helm/kagent
  contents:
  - path: .
    directory:
      path: vendor/kagent
    # Chart.yaml is repo-owned (sync/patches/chart-yaml writes the dependency
    # list); upstream's unit tests are not run here.
    excludePaths:
    - Chart.lock
    - Chart-template.yaml
    - tests/**/*
    ignorePaths:
    - Chart.yaml
    # App-owned CRDs, written by sync/patches/crds from vendor/kagent-crds.
    - crds/*/*.yaml
    # Repo-owned docs and generated schema.
    - README.md
    - README.md.gotmpl
    - .kube-linter.yaml
    - .schema.yaml
    - values.schema.json
    - zz_generated.app-platform.values.yaml

# Stage 2b: the CRD chart, the optional Helm-managed CRD lifecycle path.
# sync/patches/crds injects `keep` and copies the kmcp MCPServer CRD into
# templates/. The substrate CRDs are not shipped (substrate.enabled is false
# upstream and in every consumer).
- path: helm/kagent-crds
  contents:
  - path: .
    directory:
      path: vendor/kagent-crds
    excludePaths:
    - Chart.lock
    - Chart-template.yaml
    - charts/**/*
    - templates/NOTES.txt
    ignorePaths:
    - Chart.yaml
    - README.md
    - README.md.gotmpl
    - templates/_helpers.tpl
    - templates/mcpserver-crd.yaml
    # app-build-suite's F0001 requires a values schema; the pre-commit hook
    # generates it from values.yaml + .schema.yaml.
    - values.yaml
    - .schema.yaml
    - values.schema.json
    - zz_generated.app-platform.values.yaml
