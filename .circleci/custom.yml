# Repo-owned CircleCI additions. The setup workflow in .circleci/config.yml
# deep-merges this into the generated .circleci/workflows.yml at pipeline time
# (maps merge, lists append), so jobs added here are appended to the generated
# `build` workflow. devctl never touches this file.
version: 2.1

jobs:
  # `helm lint`, `helm template` and `helm package` all pass when the version
  # strings in the chart metadata disagree with the vendored upstream tree, and
  # when the vendored CRDs have lost `helm.sh/resource-policy: keep`. A dependency
  # bump that edits vendir.yml and runs `vendir sync` without `make sync` produces
  # both: a chart that claims one upstream kagent release and contains another,
  # and CRDs that no longer carry an annotation the README promises. They also
  # pass when the bundled kagent-tools renders into a different namespace than
  # the kagent-tool-server RemoteMCPServer URL names (hack/verify-tools-namespace.sh
  # renders the agent-platform layout, which ATS cannot exercise). This job is
  # the gate. cimg/base already carries mikefarah yq; helm is installed for the
  # render check.
  verify-vendored-tree:
    docker:
    - image: cimg/base:current
    resource_class: small
    steps:
    - checkout
    - run:
        name: Install helm
        command: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | DESIRED_VERSION=v3.21.4 bash
          helm version --short
    - run:
        name: Verify the vendored kagent tree and the rendered chart
        command: make verify

workflows:
  build:
    jobs:
    - verify-vendored-tree:
        filters:
          tags:
            only: /^v.*/
